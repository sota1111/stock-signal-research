name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_service:
        description: 'Deploy Cloud Run Service'
        required: false
        default: 'true'
        type: boolean
      deploy_jobs:
        description: 'Deploy Cloud Run Jobs'
        required: false
        default: 'true'
        type: boolean

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'asia-northeast1' }}
  SERVICE_NAME: stock-signal-service
  REGISTRY: ${{ secrets.GCP_REGION || 'asia-northeast1' }}-docker.pkg.dev
  REPOSITORY: stock-signal-registry
  SERVICE_IMAGE: stock-signal-research-app
  JOBS_IMAGE: stock-signal-research-jobs

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short || true

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Service image
        if: ${{ github.event.inputs.deploy_service != 'false' }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_IMAGE }}:latest"
          docker build -f Dockerfile.service -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "SERVICE_IMAGE_TAG=$IMAGE" >> $GITHUB_ENV

      - name: Build and push Jobs image
        if: ${{ github.event.inputs.deploy_jobs != 'false' }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.JOBS_IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.JOBS_IMAGE }}:latest"
          docker build -f Dockerfile.jobs -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "JOBS_IMAGE_TAG=$IMAGE" >> $GITHUB_ENV

      - name: Deploy Cloud Run Service
        if: ${{ github.event.inputs.deploy_service != 'false' }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ env.SERVICE_IMAGE_TAG }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --concurrency=80 \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --set-env-vars="APP_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Cloud Run Jobs
        if: ${{ github.event.inputs.deploy_jobs != 'false' }}
        run: |
          JOBS_FLAGS=(
            "--region=${{ env.REGION }}"
            "--image=${{ env.JOBS_IMAGE_TAG }}"
            "--service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}"
            "--memory=512Mi"
            "--cpu=1"
            "--task-timeout=900"
            "--max-retries=3"
            "--quiet"
          )

          for JOB_NAME in collect-papers collect-news daily-analysis; do
            if gcloud run jobs describe "$JOB_NAME" --region="${{ env.REGION }}" &>/dev/null; then
              gcloud run jobs update "$JOB_NAME" "${JOBS_FLAGS[@]}" \
                --update-env-vars="APP_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},JOB_NAME=${JOB_NAME}"
            else
              gcloud run jobs create "$JOB_NAME" "${JOBS_FLAGS[@]}" \
                --set-env-vars="APP_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},JOB_NAME=${JOB_NAME},USE_SAMPLE_DATA=false"
            fi
          done

      - name: Show deployment URL
        if: ${{ github.event.inputs.deploy_service != 'false' }}
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Service deployed at: $URL"

      - name: Clean up old Artifact Registry images
        run: |
          gcloud artifacts docker images list \
            "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_IMAGE }}" \
            --filter="UPDATE_TIME < -P30D" \
            --format="value(DIGEST)" | \
            xargs -I {} gcloud artifacts docker images delete \
              "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_IMAGE }}@{}" \
              --quiet --delete-tags 2>/dev/null || true
