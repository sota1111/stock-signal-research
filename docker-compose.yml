version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    environment:
      - APP_ENV=local
      - DATABASE_URL=sqlite:////app/data/app.db
      - PORT=8080

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.jobs
    environment:
      - APP_ENV=local
      - JOB_NAME=collect-papers
      - USE_SAMPLE_DATA=true
    profiles:
      - jobs
